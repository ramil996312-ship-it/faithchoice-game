workflows:
  ios-workflow:
    name: iOS Workflow
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: faithchoice_asc
    environment:
      groups:
        - code-signing
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "net.faithchoice.app"
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: Cap sync iOS
        script: npx cap sync ios
      - name: Strip web-only files from the iOS bundle
        script: |
          # www/ is shared with faithchoice.net, which still needs the full content-<lang>.js and the
          # reserve preview. The app loads only content-<lang>-meta.js / -stories.js (index.html, app.js),
          # so drop the rest from the iOS copy only (~3.8 MB). www/ and the site are untouched.
          cd ios/App/App/public
          rm -f content-ru.js content-en.js content-es.js content-zh.js content-hi.js content-reserve-*.js reserve-preview.html
          for l in ru en es zh hi; do
            [ -s "content-$l-meta.js" ] && [ -s "content-$l-stories.js" ] || { echo "missing split content for $l"; exit 1; }
          done
          ls -l content-*.js
      - name: Install CocoaPods dependencies
        script: cd ios/App && pod install
      - name: Fetch signing files
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
      - name: Set up signing certificate
        script: keychain add-certificates
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Increment build number
        script: |
          cd ios/App
          agvtool new-version -all $PROJECT_BUILD_NUMBER
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - ramil996312@gmail.com
